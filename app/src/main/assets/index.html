<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GökAI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0f1726;
color:white;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
flex-direction:column
}

header{
height:50px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
border-bottom:1px solid #263247;
font-size:19px;
font-weight:bold
}

#chat{
flex:1;
overflow:auto;
padding:14px
}

.welcome{
text-align:center;
margin-top:30%;
color:#b8c4d8
}

.bottom{
padding:8px;
border-top:1px solid #263247
}

.tools{
display:flex;
gap:6px;
margin-bottom:7px;
overflow-x:auto
}

button{
border:0;
border-radius:18px;
background:#202d42;
color:white;
padding:9px 12px;
font-size:14px;
white-space:nowrap
}

.active{
background:#2563eb
}

.inputrow{
display:flex;
align-items:center;
background:#192438;
border-radius:25px;
padding:4px 6px 4px 13px
}

#input{
flex:1;
border:0;
outline:0;
background:transparent;
color:white;
font-size:16px;
padding:11px 0
}

.send{
width:42px;
height:42px;
border-radius:50%;
background:white;
color:#111827;
font-size:20px;
padding:0
}

.msg{
padding:11px 14px;
margin:8px 0;
border-radius:16px;
max-width:88%;
line-height:1.4;
white-space:pre-wrap
}

.me{
background:#2b3b55;
margin-left:auto
}

.ai{
background:#182337
}

.file{
font-size:13px;
color:#9fb1ca;
margin:4px 5px
}

#keybox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.70);
align-items:center;
justify-content:center;
z-index:10
}

.modal{
width:90%;
max-width:400px;
background:#172235;
padding:20px;
border-radius:18px
}

.modal input{
width:100%;
background:#0f1726;
border:0;
color:white;
border-radius:12px;
padding:12px;
margin:10px 0
}
</style>
</head>

<body>

<header>
<span>GökAI</span>
<button onclick="openKey()">⚙</button>
</header>

<div id="chat">

<div class="welcome" id="welcome">
<h2>Merhaba 👋</h2>
<div>Bugün sana nasıl yardımcı olabilirim?</div>
</div>

</div>

<div class="bottom">

<div class="tools">

<button onclick="pickFile()">＋</button>

<button id="modeBtn"
onclick="changeMode()">
⚡ Hızlı
</button>

<button id="webBtn"
onclick="toggleWeb()">
🌐 Web
</button>

<button id="voiceBtn"
onclick="startVoice()">
🎙 Ses
</button>

</div>

<div id="fileInfo" class="file"></div>

<div class="inputrow">

<input
id="input"
placeholder="GökAI'ye bir şey sor..."
autocomplete="off">

<button
class="send"
onclick="send()">
↑
</button>

</div>
</div>

<div id="keybox">

<div class="modal">

<h3>Groq API Anahtarı</h3>

<input
id="apikey"
placeholder="gsk_...">

<button onclick="saveKey()">
Kaydet
</button>

<button onclick="closeKey()">
Kapat
</button>

</div>
</div>

<script>

let modes=["Hızlı","Düşün","Çalışma"];
let modeIndex=0;

let webOn=false;
let voiceMode=false;
let fileReady=false;

function addMessage(text,type){

const div=document.createElement("div");

div.className="msg "+type;
div.innerText=text;

document
.getElementById("chat")
.appendChild(div);

div.scrollIntoView();
}

function changeMode(){

modeIndex=(modeIndex+1)%3;

const icons=[
"⚡ ",
"🧠 ",
"💼 "
];

document
.getElementById("modeBtn")
.innerText=
icons[modeIndex]+modes[modeIndex];
}

function toggleWeb(){

webOn=!webOn;

document
.getElementById("webBtn")
.classList.toggle(
"active",
webOn
);
}

function pickFile(){

if(window.GokAIAndroid){

GokAIAndroid.pickFile();

}else{

alert("Dosya bağlantısı bulunamadı.");
}
}

window.onFilePicked=function(name){

fileReady=true;

document
.getElementById("fileInfo")
.innerText="📎 "+name;

document
.getElementById("welcome")
.style.display="none";
}

window.onFileError=function(error){

fileReady=false;

document
.getElementById("fileInfo")
.innerText="";

alert(error);
}

function startVoice(){

voiceMode=true;

document
.getElementById("voiceBtn")
.classList.add("active");

if(window.GokAIAndroid){

GokAIAndroid.startVoice();

}else{

alert("Mikrofon bağlantısı bulunamadı.");
}
}

window.onVoiceResult=function(text){

document
.getElementById("input")
.value=text;

send();
}

window.onVoiceError=function(text){

voiceMode=false;

document
.getElementById("voiceBtn")
.classList.remove("active");

alert(text);
}

function send(){

const input=
document.getElementById("input");

const text=input.value.trim();

if(!text){

if(fileReady){

input.value="Bu dosyayı incele ve bana anlat.";

}else{

return;
}
}

const finalText=
input.value.trim();

document
.getElementById("welcome")
.style.display="none";

addMessage(finalText,"me");

input.value="";

addMessage(
"Düşünüyorum...",
"ai"
);

if(window.GokAIAndroid){

GokAIAndroid.askAdvanced(
finalText,
modes[modeIndex],
webOn
);

}else{

window.onAIResult(
"Android bağlantısı bulunamadı."
);
}
}

window.onAIResult=function(text){

const msgs=
document.getElementsByClassName("ai");

if(
msgs.length>0 &&
msgs[msgs.length-1].innerText==="Düşünüyorum..."
){

msgs[msgs.length-1].remove();
}

addMessage(text,"ai");

document
.getElementById("fileInfo")
.innerText="";

fileReady=false;

if(voiceMode && window.GokAIAndroid){

GokAIAndroid.speak(text);

voiceMode=false;

document
.getElementById("voiceBtn")
.classList.remove("active");
}
}

function openKey(){

document
.getElementById("keybox")
.style.display="flex";

if(window.GokAIAndroid){

document
.getElementById("apikey")
.value=
GokAIAndroid.getApiKey();
}
}

function closeKey(){

document
.getElementById("keybox")
.style.display="none";
}

function saveKey(){

const key=
document
.getElementById("apikey")
.value
.trim();

if(!key){

alert(
"API anahtarı boş olamaz."
);

return;
}

if(window.GokAIAndroid){

GokAIAndroid.saveApiKey(key);
}

alert(
"API anahtarı kaydedildi."
);

closeKey();
}

document
.getElementById("input")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
send();
}

});
</script>

</body>
</html>
