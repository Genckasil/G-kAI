<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GökAI</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#0f1726;color:white;
font-family:Arial,sans-serif;height:100vh;
display:flex;flex-direction:column;overflow:hidden
}
header{
height:50px;display:flex;align-items:center;
justify-content:space-between;padding:0 10px;
border-bottom:1px solid #263247;font-size:19px;font-weight:bold
}
.headerLeft{display:flex;align-items:center;gap:8px}
button{
border:0;border-radius:18px;background:#202d42;color:white;
padding:9px 12px;font-size:14px;white-space:nowrap
}
.iconBtn{width:38px;height:38px;padding:0;font-size:20px}
.active{background:#2563eb}

#chat{flex:1;overflow:auto;padding:14px}
.welcome{text-align:center;margin-top:28%;color:#b8c4d8}

.bottom{padding:8px;border-top:1px solid #263247}
.tools{
display:flex;gap:6px;margin-bottom:7px;
overflow-x:auto;padding-bottom:2px
}
.inputrow{
display:flex;align-items:center;background:#192438;
border-radius:25px;padding:4px 6px 4px 13px
}
#input{
flex:1;border:0;outline:0;background:transparent;
color:white;font-size:16px;padding:11px 0
}
.send{
width:42px;height:42px;border-radius:50%;
background:white;color:#111827;font-size:20px;padding:0
}
.msg{
padding:11px 14px;margin:8px 0;border-radius:16px;
max-width:88%;line-height:1.4;white-space:pre-wrap
}
.me{background:#2b3b55;margin-left:auto}
.ai{background:#182337}
.file{font-size:13px;color:#9fb1ca;margin:4px 5px}

#overlay{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.55);z-index:20
}
#sidebar{
position:fixed;top:0;left:-82%;
width:82%;max-width:340px;height:100%;
background:#111b2b;z-index:30;transition:.22s;
display:flex;flex-direction:column;
border-right:1px solid #263247
}
#sidebar.open{left:0}
.sideTop{padding:12px;border-bottom:1px solid #263247}
.newChat{width:100%;padding:12px}
#history{flex:1;overflow:auto;padding:8px}
.historyItem{display:flex;gap:6px;margin-bottom:5px}
.historyOpen{
flex:1;text-align:left;overflow:hidden;
text-overflow:ellipsis;padding:11px
}
.deleteBtn{background:#38212a;padding:9px 11px}
.sideBottom{
padding:10px;border-top:1px solid #263247;
color:#8797af;font-size:12px
}

.modalBg{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.72);
align-items:center;justify-content:center;
z-index:50
}
.modal{
width:90%;max-width:420px;background:#172235;
padding:20px;border-radius:18px
}
.modal input,.modal textarea{
width:100%;background:#0f1726;border:0;color:white;
border-radius:12px;padding:12px;margin:9px 0;
font-size:16px
}
.modal textarea{min-height:110px;resize:vertical}
.modalActions{display:flex;gap:7px;flex-wrap:wrap}
</style>
</head>

<body>

<div id="overlay" onclick="closeSidebar()"></div>

<div id="sidebar">
<div class="sideTop">
<button class="newChat" onclick="newChat()">＋ Yeni sohbet</button>
</div>
<div id="history"></div>
<div class="sideBottom">GökAI sohbet geçmişi</div>
</div>

<header>
<div class="headerLeft">
<button class="iconBtn" onclick="openSidebar()">☰</button>
<span>GökAI</span>
</div>
<button class="iconBtn" onclick="openKey()">⚙</button>
</header>

<div id="chat">
<div class="welcome" id="welcome">
<h2>Merhaba 👋</h2>
<div>Bugün sana nasıl yardımcı olabilirim?</div>
</div>
</div>

<div class="bottom">

<div class="tools">
<button onclick="pickFile()">＋</button>
<button onclick="openCamera()">📷</button>
<button id="modeBtn" onclick="changeMode()">⚡ Hızlı</button>
<button id="webBtn" onclick="toggleWeb()">🌐 Web</button>
<button id="voiceBtn" onclick="startVoice()">🎙 Ses</button>
<button onclick="openFileMaker()">📄 Dosya</button>
<button onclick="openImageMaker()">🎨 Görsel</button>
</div>

<div id="fileInfo" class="file"></div>

<div class="inputrow">
<input id="input" placeholder="GökAI'ye bir şey sor..." autocomplete="off">
<button class="send" onclick="send()">↑</button>
</div>

</div>

<!-- API -->
<div id="keybox" class="modalBg">
<div class="modal">
<h3>API Ayarları</h3>
<input id="apikey" placeholder="Groq API anahtarı (gsk_...)">
<div class="modalActions">
<button onclick="saveKey()">Kaydet</button>
<button onclick="closeModal('keybox')">Kapat</button>
</div>
</div>
</div>

<!-- DOSYA ÜRET -->
<div id="fileMaker" class="modalBg">
<div class="modal">
<h3>📄 Dosya üret</h3>
<input id="fileName" placeholder="Dosya adı: oyun.html">
<textarea id="fileRequest" placeholder="Nasıl bir dosya oluşturayım?"></textarea>
<div class="modalActions">
<button onclick="generateFile()">Oluştur</button>
<button onclick="closeModal('fileMaker')">Kapat</button>
</div>
</div>
</div>

<!-- GÖRSEL -->
<div id="imageMaker" class="modalBg">
<div class="modal">
<h3>🎨 Görsel modu</h3>
<textarea id="imagePrompt" placeholder="Nasıl bir görsel oluşturmak istiyorsun?"></textarea>
<div class="modalActions">
<button onclick="generateImage()">Görsel oluştur</button>
<button onclick="editImage()">Ekli görseli düzenle</button>
<button onclick="closeModal('imageMaker')">Kapat</button>
</div>
</div>
</div>

<script>
let modes=["Hızlı","Düşün","Çalışma"];
let modeIndex=0;
let webOn=false;
let voiceMode=false;
let fileReady=false;

let chats=[];
let currentChatId=null;

function loadChats(){
try{
chats=JSON.parse(localStorage.getItem("gokai_chats")||"[]");
}catch(e){chats=[];}

if(chats.length===0){
createInitialChat();
}else{
currentChatId=localStorage.getItem("gokai_current")||chats[0].id;
if(!chats.find(c=>c.id===currentChatId)) currentChatId=chats[0].id;
renderCurrentChat();
}
renderHistory();
}

function createInitialChat(){
const c={id:String(Date.now()),title:"Yeni sohbet",messages:[],created:Date.now()};
chats.unshift(c);
currentChatId=c.id;
saveChats();
renderCurrentChat();
renderHistory();
}

function getCurrentChat(){
return chats.find(c=>c.id===currentChatId);
}

function saveChats(){
localStorage.setItem("gokai_chats",JSON.stringify(chats));
localStorage.setItem("gokai_current",currentChatId||"");
}

function openSidebar(){
document.getElementById("sidebar").classList.add("open");
document.getElementById("overlay").style.display="block";
renderHistory();
}

function closeSidebar(){
document.getElementById("sidebar").classList.remove("open");
document.getElementById("overlay").style.display="none";
}

function newChat(){
const c={id:String(Date.now()),title:"Yeni sohbet",messages:[],created:Date.now()};
chats.unshift(c);
currentChatId=c.id;
saveChats();
renderCurrentChat();
renderHistory();
closeSidebar();
}

function openChat(id){
currentChatId=id;
saveChats();
renderCurrentChat();
closeSidebar();
}

function deleteChat(id,e){
e.stopPropagation();
chats=chats.filter(c=>c.id!==id);

if(chats.length===0){
createInitialChat();
return;
}

if(currentChatId===id) currentChatId=chats[0].id;

saveChats();
renderCurrentChat();
renderHistory();
}

function renderHistory(){
const box=document.getElementById("history");
box.innerHTML="";

chats.forEach(c=>{
const row=document.createElement("div");
row.className="historyItem";

const open=document.createElement("button");
open.className="historyOpen";
open.innerText=c.title||"Yeni sohbet";
open.onclick=()=>openChat(c.id);

const del=document.createElement("button");
del.className="deleteBtn";
del.innerText="🗑";
del.onclick=e=>deleteChat(c.id,e);

row.appendChild(open);
row.appendChild(del);
box.appendChild(row);
});
}

function renderCurrentChat(){
const box=document.getElementById("chat");
box.innerHTML="";

const c=getCurrentChat();

if(!c || c.messages.length===0){
box.innerHTML='<div class="welcome"><h2>Merhaba 👋</h2><div>Bugün sana nasıl yardımcı olabilirim?</div></div>';
return;
}

c.messages.forEach(m=>drawMessage(m.text,m.type));
}

function drawMessage(text,type){
const d=document.createElement("div");
d.className="msg "+type;
d.innerText=text;
document.getElementById("chat").appendChild(d);
d.scrollIntoView();
}

function addMessage(text,type){
const c=getCurrentChat();
if(!c)return;

c.messages.push({text,type,time:Date.now()});

if(c.title==="Yeni sohbet" && type==="me"){
c.title=text.length>34?text.substring(0,34)+"…":text;
}

saveChats();
drawMessage(text,type);
renderHistory();
}

function removeThinking(){
const c=getCurrentChat();

if(c && c.messages.length){
const last=c.messages[c.messages.length-1];
if(last.type==="ai" && last.text==="Düşünüyorum..."){
c.messages.pop();
saveChats();
}
}

const msgs=document.getElementsByClassName("ai");
if(msgs.length && msgs[msgs.length-1].innerText==="Düşünüyorum..."){
msgs[msgs.length-1].remove();
}
}

function changeMode(){
modeIndex=(modeIndex+1)%3;
const icons=["⚡ ","🧠 ","💼 "];
document.getElementById("modeBtn").innerText=icons[modeIndex]+modes[modeIndex];
}

function toggleWeb(){
webOn=!webOn;
document.getElementById("webBtn").classList.toggle("active",webOn);
}

function pickFile(){
if(window.GokAIAndroid) GokAIAndroid.pickFile();
}

function openCamera(){
if(window.GokAIAndroid && typeof GokAIAndroid.openCamera==="function"){
GokAIAndroid.openCamera();
}else{
alert("Kamera Android tarafına henüz bağlanmadı.");
}
}

window.onFilePicked=function(name){
fileReady=true;
document.getElementById("fileInfo").innerText="📎 "+name;
}

window.onFileError=function(error){
fileReady=false;
document.getElementById("fileInfo").innerText="";
alert(error);
}

function startVoice(){
voiceMode=true;
document.getElementById("voiceBtn").classList.add("active");

if(window.GokAIAndroid){
GokAIAndroid.startVoice();
}
}

window.onVoiceResult=function(text){
document.getElementById("input").value=text;
send();
}

window.onVoiceError=function(text){
voiceMode=false;
document.getElementById("voiceBtn").classList.remove("active");
alert(text);
}

function send(){
const input=document.getElementById("input");
let text=input.value.trim();

if(!text){
if(fileReady) text="Bu dosyayı veya görseli incele ve bana anlat.";
else return;
}

addMessage(text,"me");
input.value="";
addMessage("Düşünüyorum...","ai");

if(window.GokAIAndroid){
GokAIAndroid.askAdvanced(text,modes[modeIndex],webOn);
}
}

window.onAIResult=function(text){
removeThinking();
addMessage(text,"ai");

document.getElementById("fileInfo").innerText="";
fileReady=false;

if(voiceMode && window.GokAIAndroid){
GokAIAndroid.speak(text);
voiceMode=false;
document.getElementById("voiceBtn").classList.remove("active");
}
}

function openKey(){
document.getElementById("keybox").style.display="flex";
if(window.GokAIAndroid){
document.getElementById("apikey").value=GokAIAndroid.getApiKey();
}
}

function saveKey(){
const k=document.getElementById("apikey").value.trim();
if(!k){alert("API anahtarı boş.");return;}

if(window.GokAIAndroid) GokAIAndroid.saveApiKey(k);

alert("Kaydedildi.");
closeModal("keybox");
}

function openFileMaker(){
document.getElementById("fileMaker").style.display="flex";
}

function generateFile(){
const name=document.getElementById("fileName").value.trim();
const request=document.getElementById("fileRequest").value.trim();

if(!name || !request){
alert("Dosya adı ve açıklama gerekli.");
return;
}

closeModal("fileMaker");

document.getElementById("input").value=
"Şu dosyanın yalnızca içeriğini üret. Dosya adı: "+name+
". İstek: "+request;

send();
}

function openImageMaker(){
document.getElementById("imageMaker").style.display="flex";
}

function generateImage(){
const p=document.getElementById("imagePrompt").value.trim();
if(!p){alert("Görsel açıklaması yaz.");return;}

if(window.GokAIAndroid &&
typeof GokAIAndroid.generateImage==="function"){
GokAIAndroid.generateImage(p);
}else{
alert("Görsel üretme API'sini bir sonraki adımda bağlayacağız.");
}
}

function editImage(){
const p=document.getElementById("imagePrompt").value.trim();
if(!p){alert("Nasıl düzenleneceğini yaz.");return;}

if(window.GokAIAndroid &&
typeof GokAIAndroid.editImage==="function"){
GokAIAndroid.editImage(p);
}else{
alert("Görsel düzenleme API'sini bir sonraki adımda bağlayacağız.");
}
}

window.onImageResult=function(url){
closeModal("imageMaker");
addMessage("🎨 Görsel hazır:\n"+url,"ai");
}

function closeModal(id){
document.getElementById(id).style.display="none";
}

document.getElementById("input").addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});

loadChats();
</script>

</body>
</html>
